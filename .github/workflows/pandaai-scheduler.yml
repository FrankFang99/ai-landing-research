name: PandaAI 调度 · 公开仓库兜底触发器

# 这个文件放在**公开**仓库（默认是 FrankFang99/ai-landing-research），
# 不是放在 PandaAI 的私有仓库里。
#
# 为什么要借公开仓库
# ----------------
# 2026-11-02 实测（同一个账户下）：
#   · 私有仓库 pandaai-xs-strategy 的 schedule 命中率约 **20%**
#     （探针 16 个小时级槽位只中 3 次；11-02 早上两个有效槽位连续落空，
#      月度调仓差点没人做，最后靠人工补触发才跑成）
#   · 公开仓库 ai-landing-research 的周度 schedule **19/19 全部命中**
#   → 差别只在于仓库是公开的还是新建私有的。于是借公开仓库做一个**兜底触发器**：
#     它只负责按 cron 去拉起私有仓库的 strategy.yml，
#     真正的策略逻辑、持仓、状态一个都不搬过来。
#
# 安全边界（重要）
# --------------
# 1) 本 workflow 只有 `schedule` / `workflow_dispatch` 触发器，
#    **没有 pull_request / pull_request_target / issue_comment**，
#    所以 fork 的 PR 拿不到 Secret。
# 2) Secret 不会被自动注入：只有本 workflow 显式引用 `secrets.PANDAI_PAT` 才有。
# 3) 用 **fine-grained PAT**，只授权那**一个**私有仓库的最小权限
#    （Actions: Read and write，或 Contents: Read and write 走 repository_dispatch）。
#    这样即使这个公开仓库出问题，token 也碰不到别的仓库。
# 4) 私有仓库的持仓、状态、加密凭证**全部留在私有仓库**，公开仓库只多一行触发动作。
#
# 需要的 Secret（在这个公开仓库上添加）：
#   PANDAI_PAT —— fine-grained PAT，只授权 pandaai-xs-strategy 的 Actions 写权限
#                 （或 Contents 写权限，见下面的 repository_dispatch 兜底）
#
# 添加方式（token 只进剪贴板，不经过命令行参数）：
#   gh secret set PANDAI_PAT --repo FrankFang99/ai-landing-research

on:
  schedule:
    # 按 UTC 排；北京时间 = UTC + 8。
    # 铺满 09:30~14:30（北京）这一整段调仓窗口，命中任意一个即可。
    # 分钟数刻意避开整点（整点是 GitHub 调度器最拥堵的时刻，延迟最大）。
    - cron: "17 1 * * 1-5"    # 北京 09:17
    - cron: "17 2 * * 1-5"    # 北京 10:17
    - cron: "17 3 * * 1-5"    # 北京 11:17
    - cron: "17 4 * * 1-5"    # 北京 12:17
    - cron: "17 5 * * 1-5"    # 北京 13:17
    - cron: "17 6 * * 1-5"    # 北京 14:17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandaai-public-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉起私有仓库的 strategy.yml
        env:
          GH_TOKEN: ${{ secrets.PANDAI_PAT }}
          TARGET_REPO: FrankFang99/pandaai-xs-strategy
          TARGET_WORKFLOW: strategy.yml
          TARGET_REF: main
        run: |
          set -euo pipefail
          echo "[i] 目标 ${TARGET_REPO}/${TARGET_WORKFLOW}@${TARGET_REF}"

          if [ -z "${GH_TOKEN}" ]; then
            echo "[x] Secret PANDAI_PAT 未配置 —— 请在本仓库 Settings → Secrets 里添加"
            exit 1
          fi

          # ---- 通道 A：workflow_dispatch（需要 PAT 的 Actions 写权限）----
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}")
          echo "[i] 通道 A workflow_dispatch -> HTTP ${code}"
          if [ "${code}" = "204" ]; then
            echo "[ok] 已拉起 strategy.yml（通道 A）"
            exit 0
          fi
          head -c 300 /tmp/a.json || true; echo

          # ---- 通道 B：repository_dispatch（需要 PAT 的 Contents 写权限）----
          code=$(curl -s -o /tmp/b.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "{\"event_type\":\"pandaai\",\"client_payload\":{\"action\":\"run\",\"force\":\"false\"}}")
          echo "[i] 通道 B repository_dispatch -> HTTP ${code}"
          if [ "${code}" = "204" ]; then
            echo "[ok] 已拉起 strategy.yml（通道 B）"
            exit 0
          fi
          head -c 300 /tmp/b.json || true; echo

          echo "[x] 两条通道都失败 —— 检查 PAT 是否授权了 ${TARGET_REPO}"
          exit 1
